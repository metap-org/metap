syntax = "proto3";

package metap.crud.v1;

option go_package = "github.com/metap-org/metap-go/grpcapi/pb";

import "google/protobuf/struct.proto";

// A generic, metadata-driven CRUD surface — one message shape for every entity a
// MetadataRegistry knows about, mirroring how /api/{entity}* (REST) and
// /metadata/openapi.json are already generic over entity rather than generated per-entity.
// google.protobuf.Struct (a JSON-shaped map) carries record data instead of a per-entity
// message, since entities are runtime metadata here, not compile-time Go types.
// Ported verbatim from crates/metap-grpc/proto/metap_crud.proto.
service RecordService {
  rpc List(ListRequest) returns (ListResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Create(CreateRequest) returns (RecordResponse);
  rpc Update(UpdateRequest) returns (RecordResponse);
  rpc Transition(TransitionRequest) returns (RecordResponse);
  rpc Delete(DeleteRequest) returns (RecordResponse);
  rpc Aggregate(AggregateRequest) returns (AggregateResponse);
}

message ListRequest {
  string entity_name = 1;
  google.protobuf.Struct query = 2;
}

message ListResponse {
  repeated google.protobuf.Struct records = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message GetRequest {
  string entity_name = 1;
  string id = 2;
}

message GetResponse {
  google.protobuf.Struct record = 1;
  google.protobuf.Struct capabilities = 2;
}

message CreateRequest {
  string entity_name = 1;
  google.protobuf.Struct data = 2;
  optional string reason = 3;
}

message UpdateRequest {
  string entity_name = 1;
  string id = 2;
  int32 expected_version = 3;
  google.protobuf.Struct data = 4;
  optional string reason = 5;
}

message TransitionRequest {
  string entity_name = 1;
  string id = 2;
  string action = 3;
  int32 expected_version = 4;
  google.protobuf.Struct data = 5;
  optional string reason = 6;
}

message DeleteRequest {
  string entity_name = 1;
  string id = 2;
  int32 expected_version = 3;
  optional string reason = 4;
}

message RecordResponse {
  google.protobuf.Struct record = 1;
}

message AggregateRequest {
  string entity_name = 1;
  google.protobuf.Struct spec = 2;
}

message AggregateResponse {
  repeated google.protobuf.Struct rows = 1;
}
