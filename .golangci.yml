# Architecture guard only (not a style linter): `golangci-lint run ./...` from the repo root.
# Enable more linters deliberately, in their own change — turning on the defaults here would
# bury this rule's signal under unrelated findings.
version: "2"
linters:
  default: none
  enable:
    - depguard
  settings:
    depguard:
      rules:
        # pkg/kit is imported by code outside the management plane (../waap's control-plane and
        # edge-plane) — it must stay standard-library-only so importing it never pulls in pgx,
        # chi, prometheus or any platform package.
        kit:
          list-mode: strict
          files:
            - "**/pkg/kit/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/metap-org/metap/pkg/kit
        kit-tests:
          list-mode: strict
          files:
            - "**/pkg/kit/**/*_test.go"
          allow:
            - $gostd
            - github.com/metap-org/metap/pkg/kit
            - github.com/stretchr/testify
        # One HTTP router (roadmap 118): pkg/kit/httpx/router over the standard ServeMux.
        one-router:
          files:
            - "$all"
          deny:
            - pkg: github.com/go-chi
              desc: use pkg/kit/httpx/router (standard-library ServeMux), not chi
        # Layers (roadmap 118): transport (internal/httpapi and its public face pkg/web, huma, the router) calls application
        # services (admin, signin, crud, identity, ...); never the other way round.
        application-below-transport:
          files:
            - "**/internal/admin/**"
            - "**/internal/signin/**"
            - "**/pkg/auth/identity/**"
            - "**/pkg/permission/**"
            - "**/pkg/crud/**"
            - "!$test"
          deny:
            - pkg: github.com/metap-org/metap/internal/httpapi
              desc: an application service must not import the HTTP transport
            - pkg: github.com/metap-org/metap/pkg/web
              desc: an application service must not import the HTTP transport
            - pkg: github.com/metap-org/metap/pkg/kit/httpx/router
              desc: routing belongs to the transport (internal/httpapi)
            - pkg: github.com/danielgtaylor/huma
              desc: typed-operation wiring belongs to the transport (internal/httpapi)
        # Slices (roadmap 122): internal/admin/<slice> keeps decisions apart from I/O. rules.go has no
        # database driver and no HTTP; service.go reaches the database only through its Store port, so
        # only pgstore.go imports the driver. This is what lets a slice's rules and service be unit tested.
        slice-rules-pure:
          files:
            - "**/internal/admin/*/rules.go"
          deny:
            - pkg: github.com/jackc/pgx
              desc: a slice's rules are decisions without I/O; the database is pgstore.go's
            - pkg: net/http
              desc: a slice's rules know nothing of HTTP; the transport maps their answer to a status
        slice-service-no-driver:
          files:
            - "**/internal/admin/*/service.go"
          deny:
            - pkg: github.com/jackc/pgx
              desc: a slice's service reaches the database through its Store (store.go), implemented in pgstore.go
        # Handlers write no SQL (roadmap 118): internal/httpapi holds the pgx pool as a handle
        # (AppState.Pool) and passes it, or a transaction some route modules open, to a package that
        # runs the query. This rule cannot see a query (it only keeps pgconn and pgtype out), so that
        # part is for review.
        transport-no-driver:
          files:
            - "**/internal/httpapi/**"
            - "!$test"
          deny:
            - pkg: github.com/jackc/pgx/v5/pgconn
              desc: map database errors in a service, not in a handler
            - pkg: github.com/jackc/pgx/v5/pgtype
              desc: handlers do not handle database types
