[package]
name = "jira-server"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "jira-server"
path = "src/main.rs"

[dependencies]
metap = { path = "../../crates/metap" }
metap-outbox-publisher = { path = "../../crates/outbox-publisher" }
metap-reconciler = { path = "../../crates/metap-reconciler" }
anyhow = "1"
arc-swap = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
jsonwebtoken = "9"
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
