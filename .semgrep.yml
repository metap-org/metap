# Local/CI logic-vuln scanning (`testing/security/checklist.md`) — the complement to
# `go vet`/`govulncheck` (dependency CVEs only) and CodeQL (`.github/workflows/codeql.yml`,
# GitHub-native, no local CLI story). Semgrep is the one of the three a developer can run on
# their own machine for fast feedback before pushing.
#
# This file holds only repo-local custom rules (none yet — `rules: []`). A `.semgrep.yml`
# `rules:` list cannot reference registry packs by itself (verified live 2026-08-23, not
# assumed) — `p/golang` (generic Go footguns, replacing `p/rust` once the backend moved to Go)
# and `p/secrets` (hardcoded-secret detection) must be passed explicitly on the command line and
# merge with whatever is in this file:
#
#   semgrep scan --config p/golang --config p/secrets --config .semgrep.yml
#
# Not `p/owasp-top-ten`: that pack is web-framework-pattern-heavy (SQLi/XSS in Java/PHP/JS
# idioms) and mostly doesn't apply to this codebase's actual attack surface — `p/golang` covers
# what's actually relevant here.
rules: []
