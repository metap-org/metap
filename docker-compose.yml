services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metap
      POSTGRES_PASSWORD: metap
      POSTGRES_DB: metap
    ports:
      - "5433:5432"
    volumes:
      - metap-postgres:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    # `pg_stat_statements` (docs/local-benchmarking.md) — per-query stats for the `observability`
    # profile's Grafana dashboard. Always on, not profile-gated: `shared_preload_libraries` is a
    # Postgres startup flag, not something a docker-compose profile can toggle per-container on
    # an already-running service, and the overhead is the standard, widely-recommended-always-on
    # kind (a fixed-size shared-memory ring buffer, not per-query tracing). Changing this on an
    # *existing* local container needs `docker compose down` then `up` again (recreate, not just
    # restart) for the new command to take effect.
    #
    # shared_buffers/effective_cache_size (2026-08-23, docs/roadmap.md's 10M-row/10-tenant
    # benchmark) — bumped from the image's 128MB default, found to be the root cause of a ~6.8x
    # throughput drop / p95 1.3s once the working set reached ~6.5GB. 2GB is sized for this dev
    # host's ~9.7GB total RAM (roughly the usual 20-25% guidance), not tuned for a production box.
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c shared_buffers=2GB -c effective_cache_size=4GB

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: metap
      RABBITMQ_DEFAULT_PASS: metap
    ports:
      - "5672:5672"
      - "15672:15672"

  # Opt-in (docs/roadmap.md's storage-evaluation phase) — dev SeaweedFS for
  # `metap-storage::S3ObjectStore`. NOT part of the default `docker compose up -d postgres
  # rabbitmq` dev stack. `server -s3` boots master+volume+filer+the S3 gateway all in one
  # process/container — the right shape for a small self-hosted dev stack (SeaweedFS's own
  # production topology splits these across multiple nodes, not needed here). No auth (no
  # `-s3.config`) — anonymous access, fine only because this never leaves localhost, same
  # posture as this file's Grafana anonymous-admin note below.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -ip=seaweedfs
    volumes:
      - metap-seaweedfs:/data
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # master UI/API
      - "8888:8888" # filer UI/API

  # Opt-in (docs/roadmap.md's caching-layer phase) — dev DragonflyDB for
  # `metap-cache::RedisCache`. NOT part of the default `docker compose up -d postgres rabbitmq`
  # dev stack; `MokaCache` stays the default for a single-instance boot. Speaks the same RESP
  # protocol real Redis/Valkey do — `RedisCache` connects with a plain `redis://` URL and doesn't
  # know or care it's talking to DragonflyDB specifically (see `crates/metap-cache/src/
  # redis_cache.rs`'s doc comment for the license/perf rationale). No auth (no `--requirepass`) —
  # fine only because this never leaves localhost, same posture as `seaweedfs`/`vault` above.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.1
    # `--proactor_threads`/`--maxmemory` pinned, not left to Dragonfly's own
    # detect-the-host-and-decide defaults: unpinned, it sizes memory as ~256MB per IO thread (16
    # threads on this dev host = ~4GiB required) against *currently available* RAM, not total —
    # found live when this container refused to start (`E ... There are 16 threads, so 4.00GiB
    # are required. Exiting...`) after a `cargo build` had already claimed most of the box's
    # free memory. A fixed small footprint is the right shape for a dev-only cache anyway (same
    # "sized for this dev host, not a production box" reasoning as postgres's shared_buffers
    # comment above).
    command: dragonfly --logtostderr --proactor_threads=2 --maxmemory=512mb
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"

  # Opt-in (docs/roadmap.md Phase 16 Giai đoạn 4) — dev-mode Vault for metap-control::VaultStore.
  # NOT part of the default `docker compose up -d postgres rabbitmq` dev stack; EnvStore stays
  # the default SecretStore. Dev mode = in-memory, unsealed, fixed root token, never for
  # anything but local dev.
  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: metap-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

  # Opt-in, `observability` profile only (`docs/local-benchmarking.md`) — resource metrics for
  # a benchmarking session, never part of the default `docker compose up -d postgres rabbitmq`
  # dev stack. `docker compose --profile observability up -d`. Never for anything but local
  # benchmarking — Grafana here has anonymous admin access (no login), fine on localhost only.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    profiles: ["observability"]
    environment:
      DATA_SOURCE_NAME: "postgresql://metap:metap@postgres:5432/metap?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Default command args (config/storage/console paths) plus
    # `--web.enable-remote-write-receiver` — k6's Prometheus output
    # (`testing/performance/k6/`, `k6 run -o experimental-prometheus-rw`) pushes here instead of
    # being scraped (it's a short-lived one-off run, not a stable long-running `/metrics` target).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    # crm-server runs on the host (`pnpm dev:rs`), not in this compose file — needs
    # `host.docker.internal` to resolve from inside the container. Works on Linux (Docker
    # 20.10+) via `host-gateway`, not just Docker Desktop's built-in Mac/Windows resolution.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres-exporter

  # The actual HTTP load-test engine (`testing/README.md`'s Performance section,
  # `testing/performance/k6/`) — Grafana's own k6, not a hand-rolled stress-test client. Not a
  # long-running service: no `ports`, never started by a plain `up`, invoked per-run via
  # `docker compose run --rm k6 run /scripts/<script>.js` (see `testing/performance/k6/run.sh`).
  # Reaches `crm-server` (runs on the host) via `host.docker.internal:3000`, same pattern as
  # `prometheus` above, and pushes its own metrics to `prometheus:9090` over this compose
  # network's remote-write receiver.
  k6:
    image: grafana/k6:latest
    profiles: ["observability"]
    volumes:
      - ./testing/performance/k6:/scripts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana-oss:11.3.1
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  metap-postgres:
  metap-seaweedfs:
