syntax = "proto3";

package metap.identity.v1;

option go_package = "github.com/metap-org/metap/pkg/grpcapi/pb";

// User, role and account administration (roadmaps 113, 114). Served by the token-issuing service, which owns
// identities. Every call authenticates with the caller's bearer token, like RecordService;
// UserAdminService also requires the admin role (and the admin OAuth2 scope for a scoped token).
// Timestamps are RFC 3339 strings ("" when unset), the same as record data elsewhere.

// A member of the caller's tenant.
message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
  // "active", "disabled" or "invited".
  string status = 4;
  repeated string roles = 5;
  // "local", or the external IdP that provisioned the member ("oidc", "oauth2").
  string auth_provider = 6;
  bool has_password = 7;
  string last_login_at = 8;
  string created_at = 9;
  string invited_by = 10;
  // True when the person is also a member of another tenant: their password is not this
  // tenant's to reset.
  bool shared_identity = 11;
  // For an invited member: when the open invitation expires ("" when none is open).
  string invitation_expires_at = 12;
  // Roles held only inside a scope (roles above are tenant-wide).
  repeated ScopedRole scoped_roles = 13;
}

// A role held only on the records of one scope (roadmap 115 M1): "analyst on zone Z".
message ScopedRole {
  string role = 1;
  string scope_type = 2;
  string scope_id = 3;
}

message ListUsersRequest {
  // Case-insensitive substring of email or display name.
  string search = 1;
  string status = 2;
  string role = 3;
  int32 offset = 4;
  // 1..200, default 50.
  int32 limit = 5;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

message UserIdRequest {
  string id = 1;
}

message CreateUserRequest {
  string email = 1;
  // Used only when the person has no account yet; ignored (not an error) otherwise.
  string password = 2;
  string display_name = 3;
  repeated string roles = 4;
}

message CreateUserResponse {
  User user = 1;
  // False when the email already had an account (added to this tenant, password unchanged).
  bool created_identity = 2;
}

message InviteUserRequest {
  string email = 1;
  string display_name = 2;
  repeated string roles = 3;
}

message InviteUserResponse {
  // The invited member (status "invited" until they accept).
  User user = 1;
  string expires_at = 2;
  // False when no email went out (SMTP not configured or the relay refused it): accept_url is then
  // set, for the admin to pass on by hand.
  bool email_sent = 3;
  string accept_url = 4;
}

message UpdateUserRequest {
  string id = 1;
  string display_name = 2;
}

message ResetPasswordRequest {
  string id = 1;
  string password = 2;
}

message RoleRequest {
  string id = 1;
  string role = 2;
  // Both set: assign or revoke the role only on this scope. Both empty: the tenant-wide role.
  string scope_type = 3;
  string scope_id = 4;
}

message ScopeRequest {
  string scope_type = 1;
  string scope_id = 2;
}

message ScopeMember {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  string role = 4;
}

message ListScopeMembersResponse {
  repeated ScopeMember members = 1;
}

// One role of the tenant's catalog (roadmap 114).
message Role {
  // The key members and policies refer to; never changes.
  string name = 1;
  // Active members holding the role.
  int32 user_count = 2;
  // Defined by the platform (admin, platform_admin): can't be deleted.
  bool builtin = 3;
  string id = 4;
  // "" = no label set; clients then show the name (translated if they know it).
  string label = 5;
  string description = 6;
  // Policies naming the role, basic and advanced.
  int32 policy_count = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListRolesRequest {
  // Case-insensitive substring of name, label or description.
  string search = 1;
}

message ListRolesResponse {
  repeated Role roles = 1;
}

message AuditEvent {
  string id = 1;
  // "create", "update", "delete".
  string action = 2;
  string actor_user_id = 3;
  string occurred_at = 4;
  // JSON object {field: {"before": ..., "after": ...}}.
  string diff_json = 5;
}

message ListUserAuditRequest {
  string id = 1;
  string cursor = 2;
  int32 limit = 3;
}

message ListUserAuditResponse {
  repeated AuditEvent events = 1;
  string next_cursor = 2;
}

message Empty {}

service UserAdminService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUser(UserIdRequest) returns (User);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // Adds the person as an invited member and emails them a link (7 days, single use). A new account
  // sets its password on accepting; an existing one confirms with its current password.
  rpc InviteUser(InviteUserRequest) returns (InviteUserResponse);
  // A fresh link for an invited member; the previous one stops working. Removing the member
  // (RemoveUser) withdraws the invitation.
  rpc ResendInvitation(UserIdRequest) returns (InviteUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  // Disabling revokes the member's sessions in this tenant at once.
  rpc DisableUser(UserIdRequest) returns (User);
  rpc EnableUser(UserIdRequest) returns (User);
  // Removes the member (and their roles) from this tenant; the person's account and other
  // memberships are untouched.
  rpc RemoveUser(UserIdRequest) returns (Empty);
  // Only for a person who belongs to this tenant alone (User.shared_identity false).
  rpc ResetPassword(ResetPasswordRequest) returns (Empty);
  rpc AssignRole(RoleRequest) returns (User);
  rpc RevokeRole(RoleRequest) returns (User);
  // Who holds which role on one scope ("who can see this zone").
  rpc ListScopeMembers(ScopeRequest) returns (ListScopeMembersResponse);
  rpc ListUserAudit(ListUserAuditRequest) returns (ListUserAuditResponse);
}

message RoleNameRequest {
  string name = 1;
}

message CreateRoleRequest {
  // Lowercase letters, digits and underscores, starting with a letter; at most 80.
  string name = 1;
  string label = 2;
  string description = 3;
  // Starts the new role with this existing role's basic permissions (not its members).
  string copy_from = 4;
}

message UpdateRoleRequest {
  string name = 1;
  string label = 2;
  string description = 3;
}

message ListRoleAuditRequest {
  string name = 1;
  string cursor = 2;
  int32 limit = 3;
}

// One basic permission: the role may do action on entity. action is read, create, update, delete,
// transition (every workflow action) or transition:<workflow action> (that one only).
message RoleGrant {
  string entity = 1;
  string action = 2;
}

// A policy naming the role that isn't a plain grant (a condition, a field, the record subject, or a
// deny). Shown beside the grants; edited in the policy editor.
message RolePolicy {
  string id = 1;
  string entity = 2;
  string action = 3;
  repeated string roles = 4;
  // "allow" or "deny".
  string effect = 5;
  string field = 6;
  // "context" or "record".
  string subject = 7;
  // JSON, "" when the policy has no condition.
  string condition_json = 8;
}

message RolePermissions {
  string role = 1;
  repeated RoleGrant grants = 2;
  repeated RolePolicy advanced = 3;
}

message SetRolePermissionsRequest {
  string role = 1;
  // The role's complete set of basic permissions after the call.
  repeated RoleGrant grants = 2;
}

// The tenant's role catalog (roadmap 114). Requires the admin role like UserAdminService. Assigning
// a role to a member stays UserAdminService.AssignRole / RevokeRole.
service RoleAdminService {
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc GetRole(RoleNameRequest) returns (Role);
  rpc CreateRole(CreateRoleRequest) returns (Role);
  // Label and description only: the name is the key and never changes.
  rpc UpdateRole(UpdateRoleRequest) returns (Role);
  // Refused (role_in_use) while any member holds the role or any policy names it; a built-in role
  // is never deleted.
  rpc DeleteRole(RoleNameRequest) returns (Empty);
  rpc ListRoleAudit(ListRoleAuditRequest) returns (ListUserAuditResponse);
  // The role's basic permissions across every entity, plus its advanced policies.
  rpc GetRolePermissions(RoleNameRequest) returns (RolePermissions);
  // Replaces the role's basic permissions in one transaction; advanced policies and other roles'
  // permissions are untouched. Not for the built-in admin role, which bypasses every policy.
  rpc SetRolePermissions(SetRolePermissionsRequest) returns (RolePermissions);
}

message Me {
  string user_id = 1;
  string tenant_id = 2;
  string email = 3;
  string display_name = 4;
  repeated string roles = 5;
}

message UpdateProfileRequest {
  string display_name = 1;
}

message MyTenant {
  string tenant_id = 1;
  string name = 2;
  bool current = 3;
}

message ListMyTenantsResponse {
  repeated MyTenant tenants = 1;
}

message ListTenantUsersRequest {
  // Case-insensitive substring of email or display name; "" lists everyone.
  string search = 1;
  // 0 = every active member.
  int32 limit = 2;
}

message TenantUser {
  string id = 1;
  string email = 2;
  string display_name = 3;
}

message ListTenantUsersResponse {
  repeated TenantUser users = 1;
}

// The caller's own account. Signing in, switching tenant and changing the password stay REST
// (/auth/*) because they set the session cookie.
service AccountService {
  rpc GetMe(Empty) returns (Me);
  rpc UpdateProfile(UpdateProfileRequest) returns (Me);
  rpc ListMyTenants(Empty) returns (ListMyTenantsResponse);
  // The active members of the caller's tenant, for "assign to" pickers: any signed-in member may
  // call it, unlike UserAdminService.ListUsers.
  rpc ListTenantUsers(ListTenantUsersRequest) returns (ListTenantUsersResponse);
}

// Tenant administration (roadmap 113 P3). Platform admins only: the caller's token must be a
// platform-tenant `platform_admin`. A tenant that asks to be deleted is suspended at once and
// removed after a retention window in which the request can be cancelled.
service TenantAdminService {
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc GetTenant(TenantIdRequest) returns (Tenant);
  // Registers a tenant and invites its first admin by email.
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc UpdateTenant(UpdateTenantRequest) returns (Tenant);
  rpc SuspendTenant(TenantIdRequest) returns (Tenant);
  rpc ResumeTenant(TenantIdRequest) returns (Tenant);
  rpc RequestTenantDeletion(RequestTenantDeletionRequest) returns (Tenant);
  rpc CancelTenantDeletion(TenantIdRequest) returns (Tenant);
}

message Tenant {
  string id = 1;
  string name = 2;
  string tier = 3;
  // "schema" (shared tables or a schema of its own) or "dedicated_db".
  string strategy = 4;
  // "provisioning", "active", "migrating", "suspended", "expired" or "deleted".
  string status = 5;
  string product = 6;
  string created_at = 7;
  string trial_expires_at = 8;
  // Both set while a deletion is pending ("" otherwise).
  string deletion_requested_at = 9;
  string deletion_effective_at = 10;
  int32 member_count = 11;
}

message TenantIdRequest {
  string id = 1;
}

message ListTenantsRequest {
  // Case-insensitive substring of the name, or an exact tenant id.
  string query = 1;
  string status = 2;
  string tier = 3;
  // 0 = 50; at most 200.
  int32 limit = 4;
  int32 offset = 5;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  int32 total = 2;
}

message CreateTenantRequest {
  string name = 1;
  // "" = "trial".
  string tier = 2;
  string admin_email = 3;
  string admin_display_name = 4;
  string product = 5;
}

message CreateTenantResponse {
  Tenant tenant = 1;
  string admin_member_id = 2;
  string expires_at = 3;
  bool email_sent = 4;
  // Set when the email could not be sent: the link to pass on by hand.
  string accept_url = 5;
}

message UpdateTenantRequest {
  string id = 1;
  optional string name = 2;
  optional string tier = 3;
}

message RequestTenantDeletionRequest {
  string id = 1;
  // 0 = 30 days.
  int32 retention_days = 2;
}
