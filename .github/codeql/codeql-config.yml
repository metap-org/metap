name: "CodeQL config"

# Excludes test code from CodeQL's *alerting* (not from the build — `codeql.yml`'s `go build
# ./...` still compiles everything, `paths-ignore` only filters which extracted files get
# reported on).
#
# Historical note (backend was Rust until this file's own update to Go, kept rather than
# rewritten): the original Rust-era version of this file ignored `**/tests/**`/`**/benches/**`
# — ~80 open, undismissed `rust/cleartext-logging` alerts had accumulated across
# `crates/*/tests/*.rs`, every one a false positive from the same idiom (a test asserting a call
# succeeded via `match ... { Ok(x) => x, other => panic!("expected ... to succeed, got
# {other:?}") }`, where `{other:?}` Debug-prints a value CodeQL's taint tracking traces back to a
# parse-user-id-shaped helper and flags as "cleartext logging of sensitive information" — a
# `panic!` message that only ever runs against throwaway data in CI/local dev). Go has no
# equivalent `tests/`/`benches/` directory convention (tests are `*_test.go` files colocated
# with source), so the pattern is now a glob on the filename instead.
paths-ignore:
  - "**/*_test.go"
