name: CI

# The backend moved from Rust to Go (feature/go-migration-wave-1) — this workflow was rewritten
# the same pass to build/test the Go module instead of the Rust workspace it used to. Three
# independent jobs, none needing external services for the `go` job (unit tests only — see
# dbmigrate/migrate_test.go's own doc comment convention: an e2e test that needs a real Postgres
# skips cleanly when one isn't reachable rather than failing the job). The e2e suite (real
# Postgres/RabbitMQ) used to run here too as a 4th job on every push/PR, same as the Rust-era
# `rust-e2e` job — not yet re-wired for Go; `e2e-manual.yml` is a placeholder until it is (see
# that file's own doc comment).

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — build, vet, unit tests, fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go build ./...
      - run: go vet ./...
      # Unit tests only — no DATABASE_URL/RABBITMQ_URL set, so every e2e test that dials a real
      # Postgres/RabbitMQ skips itself cleanly (each package's own testPool-style helper calls
      # t.Skipf on a connection failure rather than failing the test).
      - run: go test ./...
      # `gofmt -l` prints the files that would change; a non-empty list fails the step.
      - run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

  security:
    name: Go — dependency vulnerability audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  semgrep:
    name: Semgrep — logic/secrets scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same command as the local dev workflow (`.semgrep.yml`'s doc comment) — registry packs
      # can't be referenced from the file's own `rules:` list, they're passed on the command
      # line and merged with it.
      - run: pip install semgrep
      - run: semgrep scan --config p/golang --config p/secrets --config .semgrep.yml --error
