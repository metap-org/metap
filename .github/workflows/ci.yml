name: CI

# Phase 8 Hardening ("CI checks", docs/roadmap.md) — the first workflow in the repo. Three
# independent jobs: Rust unit tests need no external services (see metap-query/tests'
# doc comment convention: unit tests never touch a DB); Rust e2e tests need a real
# Postgres/RabbitMQ, so they get service containers mirroring docker-compose.yml's
# credentials; the frontend workspace is entirely separate tooling (pnpm).

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — build, unit tests, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      # Unit tests only — no DATABASE_URL/RABBITMQ_URL set, so every #[ignore]'d e2e test
      # is skipped automatically (see crates/metap-query/tests/*.rs's doc comment).
      - run: cargo test --workspace --locked
      # `rustfmt.toml` committed and the whole workspace reformatted to it (2026-08-16) —
      # a real merge gate now, not just informational.
      - run: cargo fmt --all --check
      # `-D warnings`: warnings were cleaned up (2026-08-16, docs/roadmap.md Phase 8) — a real
      # merge gate now, not just informational.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  security:
    name: Rust — dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Plain `cargo audit` (not the `rustsec/audit-check` action) — that action files a GitHub
      # issue per advisory by default, a side effect nobody asked for here. This just fails the
      # job; the log is the report. `.cargo/audit.toml` ignore-lists one known, unfixable,
      # not-actually-compiled advisory (see that file's comment) so this stays a real gate for
      # new/fixable issues instead of permanently red. `testing/security/checklist.md` tracks
      # what this does and doesn't cover.
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  semgrep:
    name: Semgrep — logic/secrets scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same command as the local dev workflow (`.semgrep.yml`'s doc comment) — registry packs
      # can't be referenced from the file's own `rules:` list, they're passed on the command
      # line and merged with it. Was local-only by original request; wired into CI once the one
      # known finding (`crates/dev-tools/src/main.rs`'s CLI-arg dispatch, not security-sensitive)
      # was suppressed inline with `# nosemgrep`, so this is a real 0-findings gate, not
      # permanently red.
      - run: pip install semgrep
      - run: semgrep scan --config p/rust --config p/secrets --config .semgrep.yml --error

  rust-e2e:
    name: Rust — e2e (real Postgres/RabbitMQ)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: metap
          POSTGRES_PASSWORD: metap
          POSTGRES_DB: metap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: metap
          RABBITMQ_DEFAULT_PASS: metap
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # `metap-cache`'s `redis_cache` e2e tests (`crates/metap-cache/src/redis_cache.rs`) need a
      # real RESP-protocol server — never provisioned here before, so they've always failed with
      # "Connection refused" (verified: reproduces identically on `master`, same 3 tests, same
      # error, not something a code change can fix). Plain `redis:7-alpine` rather than the
      # DragonflyDB image `docker-compose.yml` runs for local dev — same wire protocol (this
      # crate's own doc comment: "works unmodified against any of them"), and `redis:` is the
      # image GitHub Actions' own docs use for a services-block Redis, no extra research needed.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # `metap-control`'s `vault_store.rs` e2e tests (AppRole login/renewal, KV DSN read/write)
      # need a real dev Vault server — never provisioned in CI before, so they've always failed
      # with connection-refused. Went unnoticed because `cargo test --workspace -- --ignored` has
      # no `--no-fail-fast`, and `metap-cache` (whose redis_cache tests failed for the reason
      # above) sorts alphabetically before `metap-control` — so the run always aborted before
      # ever reaching these tests. Confirmed pre-existing on `master`, not caused by this PR: once
      # the redis gap above is fixed, `master`'s workspace run reaches metap-control and fails the
      # same way. Same image/root-token/port as `docker-compose.yml`'s `vault` service (dev mode —
      # auto-unsealed, no TLS) so local and CI match; `VAULT_ADDR` is set in the container's own
      # env (not just the job's) so the `vault status` health check — run via `docker exec`, which
      # inherits the container's declared env — can reach it without inline exporting.
      vault:
        image: hashicorp/vault:1.15
        env:
          VAULT_DEV_ROOT_TOKEN_ID: metap-dev-root-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
          VAULT_ADDR: http://127.0.0.1:8200
        ports: ["8200:8200"]
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "vault status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://metap:metap@localhost:5432/metap
      RABBITMQ_URL: amqp://metap:metap@localhost:5672
      REDIS_URL: redis://127.0.0.1:6379
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: metap-dev-root-token
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Mirrors `pnpm db:migrate` (apps/crm-server/package.json script): a fresh DB, no
      # prior Drizzle-applied schema to reconcile with (see crates/db-migrate's doc
      # comment) — the service container above starts empty every run.
      - name: Apply migrations
        working-directory: apps/crm-server
        run: cargo run --release -p db-migrate --locked
      # Provisions exactly the AppRole setup `crates/metap-control/tests/vault_store.rs`'s doc
      # comment documents as a one-time manual `vault` CLI operator step for local dev — done here
      # via curl+jq instead (no Vault CLI on the runner, and installing one just for this is more
      # than the job needs) against the dev Vault service container above. 3 roles: `metap-crm-server`
      # (the plain AppRole-login read test), `metap-renew-test` (token_ttl=5s, shorter than the
      # store's 60s renew buffer — exercises the fresh-login fallback), `metap-renew-single-use`
      # (token_ttl=65s + secret_id_num_uses=1 — exercises `renew_self`, which needs no `secret_id`,
      # as the regression this role's test guards against).
      - name: Provision Vault AppRole roles for the vault_store e2e tests
        run: |
          set -euo pipefail
          curl -sf --request POST --header "X-Vault-Token: $VAULT_TOKEN" \
            --data '{"type":"approle"}' "$VAULT_ADDR/v1/sys/auth/approle"
          curl -sf --request PUT --header "X-Vault-Token: $VAULT_TOKEN" \
            --data '{"policy":"path \"secret/data/metap/dsn/*\" { capabilities = [\"read\"] }"}' \
            "$VAULT_ADDR/v1/sys/policies/acl/metap-dsn-read"

          write_role() {
            local name="$1" extra_json="$2"
            curl -sf --request PUT --header "X-Vault-Token: $VAULT_TOKEN" \
              --data "{\"token_policies\":\"metap-dsn-read\"${extra_json}}" \
              "$VAULT_ADDR/v1/auth/approle/role/$name"
          }
          role_id() {
            curl -sf --header "X-Vault-Token: $VAULT_TOKEN" \
              "$VAULT_ADDR/v1/auth/approle/role/$1/role-id" | jq -r '.data.role_id'
          }
          secret_id() {
            curl -sf --request POST --header "X-Vault-Token: $VAULT_TOKEN" \
              "$VAULT_ADDR/v1/auth/approle/role/$1/secret-id" | jq -r '.data.secret_id'
          }

          write_role metap-crm-server ',"token_ttl":"1h","token_max_ttl":"4h"'
          write_role metap-renew-test ',"token_ttl":"5s","token_max_ttl":"1h"'
          write_role metap-renew-single-use ',"token_ttl":"65s","token_max_ttl":"1h","secret_id_num_uses":1'

          {
            echo "VAULT_ROLE_ID=$(role_id metap-crm-server)"
            echo "VAULT_SECRET_ID=$(secret_id metap-crm-server)"
            echo "VAULT_RENEW_ROLE_ID=$(role_id metap-renew-test)"
            echo "VAULT_RENEW_SECRET_ID=$(secret_id metap-renew-test)"
            echo "VAULT_SINGLE_USE_ROLE_ID=$(role_id metap-renew-single-use)"
            echo "VAULT_SINGLE_USE_SECRET_ID=$(secret_id metap-renew-single-use)"
          } >> "$GITHUB_ENV"
      - name: Run e2e tests
        run: cargo test --workspace --locked -- --ignored

  frontend:
    name: Frontend — typecheck, lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
