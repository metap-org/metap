name: CI

# The backend moved from Rust to Go (feature/go-migration-wave-1) — this workflow was rewritten
# the same pass to build/test the Go module instead of the Rust workspace it used to. Three
# independent jobs, none needing external services for the `go` job (unit tests only — see
# dbmigrate/migrate_test.go's own doc comment convention: an e2e test that needs a real Postgres
# skips cleanly when one isn't reachable rather than failing the job). The e2e suite (real
# Postgres/RabbitMQ) used to run here too as a 4th job on every push/PR, same as the Rust-era
# `rust-e2e` job — not yet re-wired for Go; `e2e-manual.yml` is a placeholder until it is (see
# that file's own doc comment).

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — build, vet, unit tests, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go build ./...
      - run: go vet ./...
      # Unit tests only — integration tests carry `//go:build integration` and aren't compiled
      # without that tag (see e2e-manual.yml, which runs them against real Postgres/Redis).
      - run: go test ./...
      # The integration build must at least compile and vet, even though it isn't run here.
      - run: go vet -tags integration ./...
      # Architecture guard (.golangci.yml): pkg/kit must stay standard-library-only.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      # `gofmt -l` prints the files that would change; a non-empty list fails the step.
      - run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

  # The integration suite (`//go:build integration`, real Postgres/RabbitMQ/Redis/OpenBao) runs on
  # every push and pull request: the regression tests for authentication, tenancy, permissions and
  # connection-pool behaviour live there, and a green `go` job above does not run them. Same
  # services as e2e-manual.yml, which stays for a run on demand.
  integration:
    name: Go — integration tests (Postgres, RabbitMQ, Redis, OpenBao)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: metap
          POSTGRES_PASSWORD: metap
          POSTGRES_DB: metap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: metap
          RABBITMQ_DEFAULT_PASS: metap
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      openbao:
        image: openbao/openbao:2.4.3
        env:
          BAO_DEV_ROOT_TOKEN_ID: metap-dev-root-token
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
        options: >-
          --cap-add IPC_LOCK
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://metap:metap@localhost:5432/metap
      RABBITMQ_URL: amqp://metap:metap@localhost:5672
      REDIS_URL: redis://127.0.0.1:6379
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: metap-dev-root-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # pkg/testkit migrates a template database itself and clones a fresh one per test; it fails
      # (never skips) when a service is unreachable, so green means the tests ran.
      - run: go test -tags integration ./... -timeout 10m

  security:
    name: Go — dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  semgrep:
    name: Semgrep — logic/secrets scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same command as the local dev workflow (`.semgrep.yml`'s doc comment) — registry packs
      # can't be referenced from the file's own `rules:` list, they're passed on the command
      # line and merged with it.
      - run: pip install semgrep
      - run: semgrep scan --config p/golang --config p/secrets --config .semgrep.yml --error
