[workspace]
resolver = "2"
members = [
  "apps/crm-server",
  "crates/cron-scheduler",
  "crates/db-migrate",
  "crates/dev-tools",
  "crates/metap",
  "crates/metap-control",
  "crates/metap-control-http",
  "crates/metap-cron",
  "crates/metap-crud",
  "crates/metap-lowcode",
  "crates/metap-lowcode-http",
  "crates/metap-http",
  "crates/metap-infra",
  "crates/metap-metadata",
  "crates/metap-peripherals",
  "crates/metap-permission",
  "crates/metap-query",
  "crates/metap-workflow",
  "crates/notification-worker",
  "crates/outbox-publisher",
]

[workspace.package]
edition = "2021"

# Baseline lint policy for the workspace (`docs/roadmap.md` Phase 8). The actual gate is
# `.github/workflows/ci.yml`'s `cargo clippy -- -D warnings` — this table just codifies the same
# policy declaratively so a plain local `cargo clippy` matches what CI enforces. No per-crate
# `[lints] workspace = true` opt-in exists yet since CI already gates via the CLI flag; add that
# per-crate if a local `cargo clippy` without the flag ever needs to match CI exactly.
[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
