[package]
name = "dev-tools"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "dev-tools"
path = "src/main.rs"

[dependencies]
metap-runtime = { path = "../metap-runtime" }
metap-control = { path = "../metap-control" }
metap-peripherals = { path = "../metap-peripherals" }
metap-reconciler = { path = "../metap-reconciler" }
anyhow.workspace = true
dotenvy.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "macros", "migrate"] }
uuid.workspace = true
secrecy.workspace = true
