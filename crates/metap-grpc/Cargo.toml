[package]
name = "metap-grpc"
version = "0.1.0"
edition.workspace = true

[dependencies]
metap-runtime = { path = "../metap-runtime" }
metap-control = { path = "../metap-control" }
metap-crud = { path = "../metap-crud" }
metap-jwks = { path = "../metap-jwks" }
metap-peripherals = { path = "../metap-peripherals" }
metap-permission = { path = "../metap-permission" }
metap-query = { path = "../metap-query" }
anyhow.workspace = true
async-trait.workspace = true
http = "1"
jsonwebtoken.workspace = true
prost = "0.14"
prost-types = "0.14"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tower-http = { workspace = true, features = ["trace"] }
tracing.workspace = true
uuid.workspace = true

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
arc-swap.workspace = true
metap-metadata = { path = "../metap-metadata" }
metap-peripherals = { path = "../metap-peripherals" }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
