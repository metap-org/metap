[package]
name = "metap-grpc"
version = "0.1.0"
edition.workspace = true

[dependencies]
metap-control = { path = "../metap-control" }
metap-crud = { path = "../metap-crud" }
metap-jwks = { path = "../metap-jwks" }
metap-peripherals = { path = "../metap-peripherals" }
metap-permission = { path = "../metap-permission" }
metap-query = { path = "../metap-query" }
anyhow = "1"
async-trait = "0.1"
jsonwebtoken = "9"
prost = "0.14"
prost-types = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
arc-swap = "1"
metap-metadata = { path = "../metap-metadata" }
metap-peripherals = { path = "../metap-peripherals" }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
