[package]
name = "metap-http"
version = "0.1.0"
edition.workspace = true

[dependencies]
metap-crud = { path = "../metap-crud" }
metap-infra = { path = "../metap-infra" }
metap-peripherals = { path = "../metap-peripherals" }
metap-metadata = { path = "../metap-metadata" }
metap-permission = { path = "../metap-permission" }
metap-query = { path = "../metap-query" }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = "0.4"
