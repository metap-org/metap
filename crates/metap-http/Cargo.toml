[package]
name = "metap-http"
version = "0.1.0"
edition.workspace = true

[dependencies]
metap-attachments = { path = "../metap-attachments" }
metap-auth = { path = "../metap-auth" }
metap-runtime = { path = "../metap-runtime" }
metap-control = { path = "../metap-control" }
metap-cron = { path = "../metap-cron" }
metap-dashboards = { path = "../metap-dashboards" }
metap-crud = { path = "../metap-crud" }
metap-infra = { path = "../metap-infra" }
metap-peripherals = { path = "../metap-peripherals" }
metap-metadata = { path = "../metap-metadata" }
metap-permission = { path = "../metap-permission" }
metap-query = { path = "../metap-query" }
metap-storage = { path = "../metap-storage" }
metap-workflow = { path = "../metap-workflow" }
anyhow.workspace = true
arc-swap.workspace = true
axum = { workspace = true, features = ["multipart"] }
base64.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
] }
uuid.workspace = true
jsonwebtoken.workspace = true
chrono.workspace = true
moka.workspace = true
axum-prometheus = "0.10.1"
metrics-process = "2.4.3"
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie"] }
time = "0.3.55"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
reqwest.workspace = true
chrono.workspace = true
