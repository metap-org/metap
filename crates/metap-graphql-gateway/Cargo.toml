[package]
name = "metap-graphql-gateway"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "graphql-gateway"
path = "src/main.rs"

[dependencies]
metap-runtime = { path = "../metap-runtime" }
metap-crud = { path = "../metap-crud" }
metap-graphql = { path = "../metap-graphql" }
metap-graphql-http = { path = "../metap-graphql-http" }
metap-grpc = { path = "../metap-grpc" }
metap-infra = { path = "../metap-infra" }
metap-jwks = { path = "../metap-jwks" }
metap-metadata = { path = "../metap-metadata" }
metap-peripherals = { path = "../metap-peripherals" }
metap-permission = { path = "../metap-permission" }
anyhow.workspace = true
async-graphql.workspace = true
async-graphql-axum = "7"
axum.workspace = true
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie"] }
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing.workspace = true

[dev-dependencies]
arc-swap.workspace = true
metap-control = { path = "../metap-control" }
# Only `tests/gateway_e2e_postgres.rs`'s upstream harness needs this (spins up a real
# `metap_http::build_router` REST listener to stand in for a real upstream service) — the binary
# itself never depends on `metap-http` (see `src/server.rs`'s doc comment for why).
metap-http = { path = "../metap-http" }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
uuid.workspace = true
