[package]
name = "metap-cache"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
moka = { version = "0.12", features = ["future"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
