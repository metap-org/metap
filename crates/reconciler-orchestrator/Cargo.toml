[package]
name = "metap-reconciler-orchestrator"
version = "0.1.0"
edition.workspace = true

[lib]
name = "reconciler_orchestrator"
path = "src/lib.rs"

[[bin]]
name = "reconciler-orchestrator"
path = "src/main.rs"

[dependencies]
metap-control = { path = "../metap-control" }
metap-infra = { path = "../metap-infra" }
metap-lowcode = { path = "../metap-lowcode" }
metap-reconciler = { path = "../metap-reconciler" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
metap-metadata = { path = "../metap-metadata" }
