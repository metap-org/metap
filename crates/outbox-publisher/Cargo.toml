[package]
name = "metap-outbox-publisher"
version = "0.1.0"
edition.workspace = true

[lib]
name = "outbox_publisher"
path = "src/lib.rs"

[[bin]]
name = "outbox-publisher"
path = "src/main.rs"

[dependencies]
metap-runtime = { path = "../metap-runtime" }
metap-infra = { path = "../metap-infra" }
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
sqlx = { workspace = true, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "json",
] }
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
