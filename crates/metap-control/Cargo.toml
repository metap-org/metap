[package]
name = "metap-control"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
metap-peripherals = { path = "../metap-peripherals" }
metap-permission = { path = "../metap-permission" }
moka = { version = "0.12", features = ["future"] }
secrecy = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "migrate",
  "macros",
] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
vaultrs = "0.7"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
