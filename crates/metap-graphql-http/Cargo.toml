[package]
name = "metap-graphql-http"
version = "0.1.0"
edition.workspace = true

[dependencies]
metap-auth = { path = "../metap-auth" }
metap-config = { path = "../metap-config" }
metap-control = { path = "../metap-control" }
metap-cron = { path = "../metap-cron" }
metap-crud = { path = "../metap-crud" }
metap-dashboards = { path = "../metap-dashboards" }
metap-graphql = { path = "../metap-graphql" }
metap-http = { path = "../metap-http" }
metap-metadata = { path = "../metap-metadata" }
metap-oauth-server = { path = "../metap-oauth-server" }
metap-peripherals = { path = "../metap-peripherals" }
metap-permission = { path = "../metap-permission" }
anyhow.workspace = true
async-graphql.workspace = true
async-graphql-axum = "7"
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["sync"] }
uuid.workspace = true

[dev-dependencies]
arc-swap.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
