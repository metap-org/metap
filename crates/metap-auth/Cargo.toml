[package]
name = "metap-auth"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow.workspace = true
metap-peripherals = { path = "../metap-peripherals" }
openidconnect = { version = "4", default-features = false, features = ["reqwest"] }
# The plain-OAuth2 login provider (`oauth2_login.rs`) — distinct direction from OIDC above (see
# that module's doc comment): no discovery, no id_token, just an authorize/token/userinfo dance.
# `openidconnect` is itself built on this crate (see its own `Cargo.lock` entry), so it costs
# nothing new in the dependency tree, only a direct edge where one was transitive before.
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
reqwest.workspace = true
serde.workspace = true
# For `url::Host` (`oauth2_login.rs::require_https_or_loopback`) — `reqwest::Url` re-exports the
# type but not the `Host` enum needed to distinguish an IPv6 loopback from its bracketed display
# form. Only this crate needs it directly.
url = "2"
serde_json.workspace = true
sqlx = { workspace = true, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "json",
] }
uuid.workspace = true

[dev-dependencies]
base64.workspace = true
jsonwebtoken.workspace = true
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
