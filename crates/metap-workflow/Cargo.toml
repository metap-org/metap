[package]
name = "metap-workflow"
version = "0.1.0"
edition.workspace = true

[dependencies]
metap-infra = { path = "../metap-infra" }
metap-metadata = { path = "../metap-metadata" }
metap-permission = { path = "../metap-permission" }
anyhow = "1"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "json",
] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
