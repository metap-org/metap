[package]
name = "db-migrate"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "db-migrate"
path = "src/main.rs"

[dependencies]
metap-infra = { path = "../metap-infra" }
anyhow.workspace = true
dotenvy.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
sqlx = { workspace = true, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "macros",
  "migrate",
] }
