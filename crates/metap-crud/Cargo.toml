[package]
name = "metap-crud"
version = "0.1.0"
edition.workspace = true

[dependencies]
metap-metadata = { path = "../metap-metadata" }
metap-permission = { path = "../metap-permission" }
metap-query = { path = "../metap-query" }
metap-workflow = { path = "../metap-workflow" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "json",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
