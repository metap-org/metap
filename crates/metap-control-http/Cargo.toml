[package]
name = "metap-control-http"
version = "0.1.0"
edition.workspace = true

[dependencies]
metap-control = { path = "../metap-control" }
metap-http = { path = "../metap-http" }
metap-reconciler = { path = "../metap-reconciler" }
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres"] }
uuid = { version = "1", features = ["serde"] }
