[package]
name = "metap-lowcode-http"
version = "0.1.0"
edition.workspace = true

[dependencies]
metap-http = { path = "../metap-http" }
metap-lowcode = { path = "../metap-lowcode" }
metap-metadata = { path = "../metap-metadata" }
metap-peripherals = { path = "../metap-peripherals" }
metap-permission = { path = "../metap-permission" }
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
] }
