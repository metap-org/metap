[package]
name = "metap-cron-scheduler"
version = "0.1.0"
edition.workspace = true

[lib]
name = "cron_scheduler"
path = "src/lib.rs"

[[bin]]
name = "cron-scheduler"
path = "src/main.rs"

[dependencies]
metap-runtime = { path = "../metap-runtime" }
metap-control = { path = "../metap-control" }
metap-cron = { path = "../metap-cron" }
metap-infra = { path = "../metap-infra" }
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
sqlx = { workspace = true, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "json",
] }
reqwest.workspace = true
lettre = { version = "0.11", default-features = false, features = [
  "tokio1-rustls-tls",
  "smtp-transport",
  "pool",
  "builder",
] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
secrecy.workspace = true
tracing.workspace = true
